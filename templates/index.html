<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Dindigul Vegetable Price Prediction</title>

  <!-- Mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2e7d32">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f6f5;
    }

    h2 {
      color: #2e7d32;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin: 10px 0;
      width: 200px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1b5e20;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>

<body>


  <h2>🥦 Smart Vegetable Price Forecast for Dindigul Markets</h2>
<p>AI-powered insights to help farmers choose the best market day</p>


  <input type="date" id="date">
  <br><br>

  <button onclick="predict()">Check Upcoming Market Prices</button>
  <p>
Select any upcoming market date to compare prices and decide the best day to sell.
</p>

<h3 id="result"></h3>

  <!-- Prediction Script -->
  <script>
    function predict() {
      const date = document.getElementById("date").value;

      if (!date) {
        alert("Please select a date");
        return;
      }

      fetch("/predict", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ date: date })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("result").innerHTML =
          `Retail Min Price: ₹${data.retail_min} <br>
           Retail Max Price: ₹${data.retail_max}`;
      })
      .catch(error => {
        document.getElementById("result").innerHTML =
          "❌ Error predicting price";
        console.error(error);
      });
    }
  </script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/service-worker.js")
          .then(() => console.log("Service Worker Registered"))
          .catch(err => console.log("Service Worker Error:", err));
      });
    }
  </script>

</body>
</html>
