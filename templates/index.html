<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dindigul Vegetable Price Prediction</title>

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2e7d32">

  <style>
    #chatbot-icon {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #2e7d32;
  color: white;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  z-index: 999;
}

#chatbot-box {
  display: none;
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 260px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.25);
  padding: 10px;
  z-index: 999;
}

#chat-header {
  font-weight: bold;
  margin-bottom: 8px;
  text-align: center;
}

#chat-body {
  height: 140px;
  overflow-y: auto;
  font-size: 14px;
  margin-bottom: 6px;
}

#chat-input {
  width: 100%;
  padding: 6px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f6f5;
    }

    h2 {
      color: #2e7d32;
      margin-bottom: 5px;
    }

    p {
      color: #555;
      font-size: 14px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin: 10px 0;
      width: 230px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 32px;
      font-size: 16px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1b5e20;
    }

    #result {
      display: none;
      margin-top: 25px;
      font-size: 16px;
      background: #ffffff;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      max-width: 340px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    .advice-good {
      color: green;
      font-weight: bold;
    }

    .advice-wait {
      color: #d84315;
      font-weight: bold;
    }

    .confidence-high {
      color: green;
      font-weight: bold;
    }

    .confidence-medium {
      color: orange;
      font-weight: bold;
    }

    .confidence-low {
      color: red;
      font-weight: bold;
    }

    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h2>🥦 Smart Vegetable Price Forecast</h2>
  <p>AI-powered guidance for Dindigul farmers to choose the best market day</p>

  <!-- Date -->
  <input type="date" id="date">

  <!-- Disable past dates -->
  <script>
    const dateInput = document.getElementById("date");
    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;
  </script>

  <!-- Quantity -->
  <input type="number" id="quantity" placeholder="Enter quantity (kg)" min="1">

  <br>

  <button onclick="predict()">Check Market Price</button>

  <p>Select an upcoming date and quantity to estimate your earnings.</p>

  <div id="result"></div>

  <!-- Prediction Script -->
  <script>
function toggleChat() {
  const box = document.getElementById("chatbot-box");
  box.style.display = box.style.display === "none" ? "block" : "none";
}

document.getElementById("chat-input").addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendChat();
});

function sendChat() {
  const input = document.getElementById("chat-input");
  const msg = input.value;
  if (!msg) return;

  const body = document.getElementById("chat-body");
  body.innerHTML += `<div><b>You:</b> ${msg}</div>`;

  fetch("/chatbot", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: msg })
  })
  .then(res => res.json())
  .then(data => {
    body.innerHTML += `<div><b>Bot:</b> ${data.reply}</div>`;
    body.scrollTop = body.scrollHeight;
  });

  input.value = "";
}
</script>

  <script>
    function predict() {
      const date = document.getElementById("date").value;
      const quantity = document.getElementById("quantity").value;

      if (!date || !quantity) {
        alert("Please select date and enter quantity");
        return;
      }

      fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date: date })
      })
      .then(response => response.json())
      .then(data => {
        const minPrice = data.retail_min;
        const maxPrice = data.retail_max;

        const minEarning = (quantity * minPrice).toFixed(2);
        const maxEarning = (quantity * maxPrice).toFixed(2);

        /* 🧠 Market advice */
        let adviceText = "";
        let adviceClass = "";

        if (maxPrice >= 40) {
          adviceText = "✅ நல்ல விலை – சந்தைக்கு கொண்டு செல்லலாம்";
          adviceClass = "advice-good";
        } else {
          adviceText = "⚠️ விலை குறைவு – இன்னும் காத்திருக்கலாம்";
          adviceClass = "advice-wait";
        }

        /* ✅ Confidence calculation */
        const range = maxPrice - minPrice;
        let confidenceText = "";
        let confidenceClass = "";

        if (range <= 4) {
          confidenceText = "High confidence (≈ 85–90%)";
          confidenceClass = "confidence-high";
        } else if (range <= 7) {
          confidenceText = "Medium confidence (≈ 70–80%)";
          confidenceClass = "confidence-medium";
        } else {
          confidenceText = "Low confidence (≈ 60–65%)";
          confidenceClass = "confidence-low";
        }

        document.getElementById("result").style.display = "block";
        document.getElementById("result").innerHTML = `
          <b>📊 Predicted Prices</b><br>
          Retail Min: ₹${minPrice}<br>
          Retail Max: ₹${maxPrice}<br><br>

          <b>💰 Estimated Earnings (${quantity} kg)</b><br>
          ₹${minEarning} – ₹${maxEarning}<br><br>

          <b>🧑‍🌾 Market Advice</b><br>
          <span class="${adviceClass}">${adviceText}</span><br><br>

          <b>📈 Prediction Confidence</b><br>
          <span class="${confidenceClass}">${confidenceText}</span>

          <div class="note">
            ⚠️ Prices are predicted using historical market data.<br>
            ₹4–₹5 variation is normal due to demand, supply, and daily market changes.
          </div>
        `;
      })
      .catch(error => {
        document.getElementById("result").style.display = "block";
        document.getElementById("result").innerHTML =
          "❌ Error predicting price. Please try again.";
        console.error(error);
      });
    }
  </script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/service-worker.js")
          .then(() => console.log("Service Worker Registered"));
      });
    }
  </script>
  <!-- Chatbot Floating Icon -->
<div id="chatbot-icon" onclick="toggleChat()">🐱</div>

<!-- Chatbot Window -->
<div id="chatbot-box">
  <div id="chat-header">🐱 Help Bot</div>
  <div id="chat-body"></div>
  <input type="text" id="chat-input" placeholder="How can I help?" />
</div>


</body>
</html>
