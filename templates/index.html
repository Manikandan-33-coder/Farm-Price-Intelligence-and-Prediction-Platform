<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dindigul Vegetable Price Prediction</title>

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2e7d32">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f6f5;
    }

    h2 {
      color: #2e7d32;
      margin-bottom: 5px;
    }

    p {
      color: #555;
      font-size: 14px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin: 10px 0;
      width: 230px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 32px;
      font-size: 16px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1b5e20;
    }

    #result {
      display: none;
      margin-top: 25px;
      font-size: 16px;
      background: #ffffff;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    .advice-good {
      color: green;
      font-weight: bold;
    }

    .advice-wait {
      color: #d84315;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>🥦 Smart Vegetable Price Forecast</h2>
  <p>AI-powered guidance for Dindigul farmers to choose the best market day</p>

  <!-- Date -->
  <input type="date" id="date">

  <!-- Disable past dates -->
  <script>
    const dateInput = document.getElementById("date");
    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;
  </script>

  <!-- Quantity -->
  <input type="number" id="quantity" placeholder="Enter quantity (kg)" min="1">

  <br>

  <button onclick="predict()">Check Market Price</button>

  <p>Select an upcoming date and quantity to estimate your earnings.</p>

  <div id="result"></div>

  <!-- Prediction Script -->
  <script>
    function predict() {
      const date = document.getElementById("date").value;
      const quantity = document.getElementById("quantity").value;

      if (!date || !quantity) {
        alert("Please select date and enter quantity");
        return;
      }

      fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date: date })
      })
      .then(response => response.json())
      .then(data => {
        const minPrice = data.retail_min;
        const maxPrice = data.retail_max;

        const minEarning = (quantity * minPrice).toFixed(2);
        const maxEarning = (quantity * maxPrice).toFixed(2);

        let adviceText = "";
        let adviceClass = "";

        if (maxPrice >= 40) {
          adviceText = "✅ நல்ல விலை – சந்தைக்கு கொண்டு செல்லலாம்";
          adviceClass = "advice-good";
        } else {
          adviceText = "⚠️ விலை குறைவு – இன்னும் காத்திருக்கலாம்";
          adviceClass = "advice-wait";
        }

        document.getElementById("result").style.display = "block";
        document.getElementById("result").innerHTML = `
          <b>📊 Predicted Prices</b><br>
          Retail Min: ₹${minPrice}<br>
          Retail Max: ₹${maxPrice}<br><br>

          <b>💰 Estimated Earnings (${quantity} kg)</b><br>
          ₹${minEarning} – ₹${maxEarning}<br><br>

          <b>🧑‍🌾 Market Advice</b><br>
          <span class="${adviceClass}">${adviceText}</span>
        `;
      })
      .catch(error => {
        document.getElementById("result").style.display = "block";
        document.getElementById("result").innerHTML =
          "❌ Error predicting price. Please try again.";
        console.error(error);
      });
    }
  </script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/service-worker.js")
          .then(() => console.log("Service Worker Registered"));
      });
    }
  </script>

</body>
</html>
