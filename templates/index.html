<!DOCTYPE html>
<html>
<head>
  <title>Dindigul Vegetable Price</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2e7d32">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <h2>🥦 Dindigul Vegetable Price</h2>

  <input type="date" id="date"><br><br>
  <button onclick="predict()">Predict Tomorrow Price</button>

  <h3 id="result"></h3>

<script>
function predict() {
  fetch("/predict", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      date: document.getElementById("date").value
    })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("result").innerHTML =
      `Retail Min: ₹${data.retail_min}<br>Retail Max: ₹${data.retail_max}`;
  });
}
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/service-worker.js");
}
</script>

</body>
</html>
