<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dindigul Vegetable Price Prediction</title>

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2e7d32">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f6f5;
    }

    h2 {
      color: #2e7d32;
      margin-bottom: 5px;
    }

    p {
      color: #555;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin: 10px 0;
      width: 220px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 30px;
      font-size: 16px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1b5e20;
    }

    #result {
      margin-top: 25px;
      font-size: 17px;
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: inline-block;
      min-width: 260px;
    }
  </style>
</head>

<body>

  <h2>🥦 Smart Vegetable Price Forecast for Dindigul Markets</h2>
  <p>AI-powered insights to help farmers choose the best market day</p>

  <!-- Date -->
  <input type="date" id="date">

  <!-- Disable past dates -->
  <script>
    const dateInput = document.getElementById("date");
    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;
  </script>

  <br>

  <!-- Quantity -->
  <input type="number" id="quantity" placeholder="Enter quantity (kg)" min="1">

  <br>

  <button onclick="predict()">Check Upcoming Market Prices</button>

  <p>Select a future market date and quantity to estimate earnings.</p>

  <div id="result"></div>

  <!-- Prediction Script -->
  <script>
    function predict() {
      const date = document.getElementById("date").value;
      const quantity = document.getElementById("quantity").value;

      if (!date || !quantity) {
        alert("Please select date and enter quantity");
        return;
      }

      fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date: date })
      })
      .then(response => response.json())
      .then(data => {
        const minPrice = data.retail_min;
        const maxPrice = data.retail_max;

        const minEarning = (quantity * minPrice).toFixed(2);
        const maxEarning = (quantity * maxPrice).toFixed(2);

        document.getElementById("result").innerHTML = `
          <b>Predicted Prices</b><br><br>
          Retail Min Price: ₹${minPrice}<br>
          Retail Max Price: ₹${maxPrice}<br><br>
          <b>Estimated Earnings (${quantity} kg)</b><br>
          ₹${minEarning} – ₹${maxEarning}
        `;
      })
      .catch(error => {
        document.getElementById("result").innerHTML =
          "❌ Error predicting price";
        console.error(error);
      });
    }
  </script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/service-worker.js");
      });
    }
  </script>

</body>
</html>
